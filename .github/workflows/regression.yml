name: Regression Tests

on:
  schedule:
    - cron: '0 18 * * 1-5'
  workflow_dispatch:

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 25
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps
      - name: Start ParaBank
        run: docker run -d -p 8080:8080 --name parabank parasoft/parabank
      - name: Wait for ParaBank
        run: |
          for i in {1..30}; do
            if curl -fsS http://localhost:8080/parabank/index.htm > /dev/null; then
              echo "ParaBank is ready"
              exit 0
            fi
            echo "Waiting for ParaBank..."
            sleep 2
          done

          echo "ParaBank failed to start"
          docker logs parabank
          exit 1
      - name: Run regression tests
        run: npx playwright test --grep "@regression" --project=chromium --project=api
        env:
          BASE_URL: http://localhost:8080/parabank/
          PARABANKUSERNAME: ${{ secrets.PARABANKUSERNAME }}
          PARABANKPASSWORD: ${{ secrets.PARABANKPASSWORD }}
      - name: Upload regression report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: regression-playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14