name: Smoke Tests

on:
  push:
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 25
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps
      - name: Start ParaBank
        run: docker run -d -p 8080:8080 --name parabank parasoft/parabank
      - name: Wait for ParaBank
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8080/parabank/index.htm > /dev/null; then
              echo "ParaBank is up"
              exit 0
            fi
            echo "Waiting for ParaBank ($i/30)..."
            sleep 5
          done
          echo "ParaBank did not start in time"
          docker logs parabank
          exit 1
      - name: Run smoke tests
        run: npm run test:smoke
        env:
          BASE_URL: http://localhost:8080/parabank/
          PARABANKUSERNAME: ${{ secrets.PARABANKUSERNAME }}
          PARABANKPASSWORD: ${{ secrets.PARABANKPASSWORD }}
      - name: Upload test report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14